[package]
name = "surface-proto"
version.workspace = true
edition.workspace = true
publish = false
description = "The surface contract: catalogs, controls, bindings, curves, and the engine service."

[dependencies]
architect.workspace = true
feed-proto = { path = "../../feed/feed-proto" }
facet.workspace = true
uuid.workspace = true
serde.workspace = true
vox = { workspace = true, optional = true }

# `vox` is the RPC face (on by default); without it the trait is plain.
[features]
default = ["vox"]
vox = ["dep:vox", "architect/vox"]

[lints]
workspace = true
