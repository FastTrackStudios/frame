[package]
name = "surface-runtime"
description = "Runs a control surface: gestures, value → visuals, meter ballistics, edit coalescing, engine sync."
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
surface-proto = { path = "../surface-proto", default-features = false }
document-proto = { path = "../../document/document-proto", default-features = false }
uuid.workspace = true

[features]
default = ["vox"]
# The vox client as an `Engine` (remote engines).
vox = ["surface-proto/vox"]

[dev-dependencies]
architect = { workspace = true, features = ["vox", "local"] }
surface-proto = { path = "../surface-proto" }
surface-memory = { path = "../surface-memory" }
tokio.workspace = true

[lints]
workspace = true
