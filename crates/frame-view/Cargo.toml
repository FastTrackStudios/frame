[package]
name = "frame-view"
description = "The frame.surface view kind for architect's embedded views: its registration, a Frame surface painted as SVG into a Dioxus view, and `frame-surface`, a process extension showing one"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
frame = { path = "../frame", default-features = false, features = ["embed"] }
# The kinds registry (the model, no Dioxus).
architect-workspace = { workspace = true }
# A process extension's end: its view's VirtualDom, its actions.
architect-extensions = { workspace = true, features = ["guest"] }
dioxus = { workspace = true }
kurbo = { workspace = true }
peniko = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[[bin]]
name = "frame-surface"
path = "src/bin/frame-surface.rs"
