[package]
name = "frame-ui"
description = "Frame UI — Dioxus components for Figma-compatible design rendering"
version.workspace = true
edition.workspace = true

[dependencies]
frame-proto = { path = "../frame-proto" }
figma-api = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["time"] }

# UI framework (conditional on feature)
dioxus = { workspace = true, optional = true, features = ["desktop"] }
anyrender = { workspace = true, optional = true }
anyrender_svg = { workspace = true, optional = true }
anyrender_vello = { workspace = true, optional = true }
vello = { workspace = true, optional = true }
kurbo = { workspace = true, optional = true }
peniko = { workspace = true, optional = true }
skrifa = { version = "0.26", optional = true }
base64 = { version = "0.22", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"], optional = true }
taffy = { workspace = true }
winit = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }

[features]
default = ["web"]
web = ["dep:dioxus"]
anyrender = ["dep:anyrender", "dep:anyrender_svg", "dep:anyrender_vello", "dep:vello", "dep:kurbo", "dep:peniko", "dep:skrifa", "dep:base64", "dep:image", "dep:winit", "dep:pollster"]

[lints]
workspace = true
