[package]
name = "frame-mcp"
description = "MCP server: lets any MCP client (Claude, …) design frame control surfaces."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "frame-mcp"
path = "src/main.rs"

[dependencies]
frame = { path = "../..", features = ["design", "io", "runtime"] }
frame-architect = { path = "../../../frame-architect", features = ["library", "remote"] }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
frame-architect = { path = "../../../frame-architect", features = ["library"] }
architect = { workspace = true, features = ["vox", "local"] }

[lints]
workspace = true
