[package]
name = "frame-editor"
description = "Frame's editor on the figcraft engine (slim build: no PDF, wasm plugins, font downloads or VectorDrawable)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
ui = ["dep:dioxus", "dep:tokio", "dep:fontique"]

[dependencies]
frame-doc = { path = "../frame-doc" }
figcraft-engine = { workspace = true }
frame = { path = "../frame", features = ["theme"] }
serde_json = { workspace = true }
dioxus = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
fontique = { version = "0.12", features = ["fontconfig-dlopen"], optional = true }

[dev-dependencies]
frame = { path = "../frame", features = ["embed"] }
serde_json = { workspace = true }
