# frame — an architect consumer repo (github.com/FastTrackStudios/architect).
# Layout: apps/<app>/<role>, crates/ (facades), features/<feature>/<feature>-<role>,
# xtask/ (build tooling; in members, never default-members).

[workspace]
resolver = "2"
members = [
    # ── apps ──────────────────────────────────────────────────────────
    "apps/frame/cli",
    "apps/frame/mcp",
    "apps/frame/desktop",
    "apps/frame/library-server",
    # ── facade ────────────────────────────────────────────────────────
    "crates/frame",
    # ── embed: frame surfaces in a host's strip (mixer rack, REAPER TCP/MCP)
    "crates/frame-embed",
    # ── design: AI authoring — lint, tools, MCP ──────────────────────
    "features/design/design-lint",
    "features/design/design-session",
    # ── document: the frame file format + model ───────────────────────
    "features/document/document-proto",
    "features/document/document-loro",
    "features/document/document-bundle",
    "features/document/document-text",
    "features/document/document-io",
    # ── feed: typed telemetry — kinds, requests, realtime taps, demos ─
    "features/feed/feed-proto",
    "features/feed/feed-dsp",
    "features/feed/feed-memory",
    # ── figma: import only, one way into frame documents ──────────────
    "features/figma/figma-import",
    "features/figma/figma-model",
    "features/figma/figma-rest",
    # ── library: store, find and live-follow surfaces ─────────────────
    "features/library/library-proto",
    "features/library/library-fs",
    "features/library/library-link",
    # ── motion: declarative animation on nodes — data + evaluator ─────
    "features/motion/motion-proto",
    "features/motion/motion-runtime",
    # ── render ────────────────────────────────────────────────────────
    "features/render/render",
    "features/render/render-fonts",
    # ── surface: controls, bindings, engine contract, runtime ─────────
    "features/surface/surface-proto",
    "features/surface/surface-memory",
    "features/surface/surface-runtime",
    "features/surface/surface-widgets",
    "features/surface/surface-kit",
    # ── examples ──────────────────────────────────────────────────────
    "examples/plugin-faces",
    # ── tooling ───────────────────────────────────────────────────────
    "xtask",
]
default-members = [
    "apps/frame/cli",
    "apps/frame/mcp",
    "apps/frame/desktop",
    "apps/frame/library-server",
    "crates/frame",
    "crates/frame-embed",
    "features/design/design-lint",
    "features/design/design-session",
    "features/document/document-proto",
    "features/document/document-loro",
    "features/document/document-bundle",
    "features/document/document-text",
    "features/document/document-io",
    "features/feed/feed-proto",
    "features/feed/feed-dsp",
    "features/feed/feed-memory",
    "features/figma/figma-import",
    "features/figma/figma-model",
    "features/figma/figma-rest",
    "features/library/library-proto",
    "features/library/library-fs",
    "features/library/library-link",
    "features/motion/motion-proto",
    "features/motion/motion-runtime",
    "features/render/render",
    "features/render/render-fonts",
    "features/surface/surface-proto",
    "features/surface/surface-memory",
    "features/surface/surface-runtime",
    "features/surface/surface-widgets",
    "features/surface/surface-kit",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
# architect services are async-fn traits by design; hosts pick the runtime.
async_fn_in_trait = "allow"
# architect's derive macros emit `cfg(feature = "fake")` arms.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("vox", "server", "fake"))'] }

[workspace.lints.clippy]

[workspace.dependencies]
# Figma API types
figma-api = { git = "https://github.com/gridaco/figma-api-rust.git" }

# Common
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
tokio = { version = "1.48", features = ["full"] }

# architect stack — pinned to exactly what signal pins (signal depends on
# frame's crates, and one graph can hold only one architect/facet/vox).
# Bump together with signal's root Cargo.toml.
architect = { git = "https://github.com/FastTrackStudios/architect", tag = "v0.0.2" }
crdt = { git = "https://github.com/FastTrackStudios/architect", rev = "5e4bb829674fe8b2d3527c3b65b9ab3a2b6baa86" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind", "serde"] }
facet = { version = "0.50.0-rc.5", features = ["reflect", "chrono", "uuid"] }
vox = { version = "0.10.0-rc.5", default-features = false, features = ["runtime"] }
vox-core = { version = "0.10.0-rc.5" }
vox-websocket = { version = "0.10.0-rc.5" }
sea-orm = { version = "1", features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-rustls", "macros", "with-uuid", "with-chrono"] }

# Rendering (behind features in features/render/render)
anyrender = { git = "https://github.com/DioxusLabs/anyrender.git", branch = "main" }
anyrender_svg = { git = "https://github.com/DioxusLabs/anyrender.git", branch = "main" }
anyrender_vello = { git = "https://github.com/DioxusLabs/anyrender.git", branch = "main" }
kurbo = "0.13"
peniko = "0.6"
taffy = { version = "0.7", default-features = false, features = ["std", "flexbox", "taffy_tree"] }
image = "0.25"
winit = "0.30"
vello = "0.10.0"
pollster = "0.4"

# Mirrors signal's [patch.crates-io] entries for the architect stack.
# Patches only apply in the workspace that declares them; when signal builds
# frame's crates, signal's table is the one in force — so frame must build
# against exactly these.
[patch.crates-io]
phon = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.1.0" }
phon-jit = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.1.0" }
