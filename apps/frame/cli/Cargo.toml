[package]
name = "frame-cli"
description = "Frame command-line tools: import, render, diff, diagnostics"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
figma-rest = { path = "../../../features/figma/figma-rest" }
figma-import = { path = "../../../features/figma/figma-import" }
render = { path = "../../../features/render/render" }
document-proto = { path = "../../../features/document/document-proto", default-features = false }
document-text = { path = "../../../features/document/document-text" }
surface-proto = { path = "../../../features/surface/surface-proto" }
surface-runtime = { path = "../../../features/surface/surface-runtime", features = ["remote"] }
tokio = { workspace = true }
architect = { workspace = true, features = ["vox"] }
surface-widgets = { path = "../../../features/surface/surface-widgets" }
surface-memory = { path = "../../../features/surface/surface-memory" }
serde = { workspace = true }
serde_json = { workspace = true }
roxmltree = "0.20"
kurbo = { workspace = true, optional = true }
peniko = { workspace = true, optional = true }
skrifa = { version = "0.26", optional = true }
vello = { workspace = true, optional = true }
winit = { workspace = true, optional = true }
image = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }

[features]
default = ["anyrender", "svg_export"]
svg_export = ["render/svg_export"]
anyrender = ["render/anyrender", "dep:kurbo", "dep:peniko", "dep:skrifa", "dep:vello", "dep:winit", "dep:image", "dep:pollster", "svg_export"]

[lints]
workspace = true
