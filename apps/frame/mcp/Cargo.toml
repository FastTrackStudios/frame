[package]
name = "frame-mcp"
description = "MCP server: lets any MCP client (Claude, …) design frame control surfaces."
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "frame-mcp"
path = "src/main.rs"

[dependencies]
design-session = { path = "../../../features/design/design-session" }
document-proto = { path = "../../../features/document/document-proto", default-features = false }
document-text = { path = "../../../features/document/document-text" }
surface-memory = { path = "../../../features/surface/surface-memory" }
serde_json = { workspace = true }

[lints]
workspace = true
