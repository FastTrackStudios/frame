name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A PR's new push supersedes its old run; a push to main always finishes,
# so every main commit says whether it is green.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No RUSTFLAGS / CARGO_TARGET_*_RUSTFLAGS here: either would replace the
# rustflags tables in .cargo/config.toml, and with them the kache keys
# Frame shares with Studio. `-D warnings` goes on clippy instead.
env:
  CARGO_TERM_COLOR: always

# Pull requests run on GitHub-hosted runners (the repo is public, and the
# THEBATTLESHIP pool refuses pull_request jobs from public repos); pushes to
# main run on the pool, with kache. .github/actions/rust-env sets up either.
# The toolchain and native libraries (Vulkan loader, mold) come from the
# flake's `ci` shell.
jobs:
  lint:
    name: Lint (fmt + clippy + boundary)
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted","thebattleship"]') }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-env
        with:
          job: lint
      - name: fmt
        run: nix develop --accept-flake-config .#ci --command cargo fmt --all -- --check
      - name: clippy
        if: ${{ !cancelled() }}
        run: nix develop --accept-flake-config .#ci --command cargo clippy --workspace --all-targets -- -D warnings
      # `frame` (core) has no architect, vox, Dioxus or figcraft in its
      # normal dependency tree; the integration is frame-architect.
      - name: core boundary
        if: ${{ !cancelled() }}
        run: nix develop --accept-flake-config .#ci --command just boundary

  check:
    name: Check
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted","thebattleship"]') }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-env
        with:
          job: test
      - name: just check
        run: nix develop --accept-flake-config .#ci --command just check
      - name: just test
        run: nix develop --accept-flake-config .#ci --command just test

  # An app pinning Frame by tag, as the README shows, built against this
  # commit: the snippet and its [patch] tables stay true.
  consumer:
    name: Consumer
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted","thebattleship"]') }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-env
        with:
          job: consumer
      - name: just consumer
        run: nix develop --accept-flake-config .#ci --command just consumer

  # The one status to require on main: it passes only when every job above
  # succeeded; a skipped or cancelled job fails it.
  ci:
    name: ci
    if: ${{ always() }}
    needs: [lint, check, consumer]
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted","thebattleship"]') }}
    steps:
      - name: all checks passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "lint/check/consumer: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
