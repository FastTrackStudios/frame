# The build environment for one checks job, on either kind of runner.
#
# - Pull requests run on GitHub-hosted ubuntu-latest: the repo is public,
#   and the THEBATTLESHIP pool refuses pull_request jobs from public repos.
#   Here: disk freed, nix installed, the cargo home and target dir cached per
#   job (rust-cache; restores main's, saves the PR's own).
# - Pushes to main run on the pool, which brings nix and kache
#   (RUSTC_WRAPPER over the host's shared store); the target dir goes in the
#   instance's CI_CACHE_DIR.
#
# Either way the commands run in the flake's `ci` shell, and nothing sets
# RUSTFLAGS: .cargo/config.toml's tables stay in force.

name: rust env
description: Nix, and a warm target dir, for one checks job.

inputs:
  job:
    description: The job's name, keying its target dir and cache.
    required: true

runs:
  using: composite
  steps:
    - name: Free disk (hosted)
      if: ${{ runner.environment == 'github-hosted' }}
      shell: bash
      run: |
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
          /opt/hostedtoolcache /usr/share/swift /usr/local/share/powershell \
          /usr/local/share/chromium /usr/local/share/boost /opt/microsoft /opt/google
        df -h / | tail -n 1
    - name: Install nix (hosted)
      if: ${{ runner.environment == 'github-hosted' }}
      uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ github.token }}
        extra_nix_config: |
          accept-flake-config = true
    - name: Cargo cache (hosted)
      if: ${{ runner.environment == 'github-hosted' }}
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: checks-${{ inputs.job }}
    - name: Target dir (pool)
      if: ${{ runner.environment == 'self-hosted' }}
      shell: bash
      env:
        JOB: ${{ inputs.job }}
      run: echo "CARGO_TARGET_DIR=${CI_CACHE_DIR:?}/frame/${JOB}/target" >> "$GITHUB_ENV"
    - name: Realise the ci shell
      shell: bash
      run: nix develop --accept-flake-config .#ci -c true
