# The build environment for one checks job on a GitHub-hosted runner
# (ubuntu-latest, pull requests). The pool twin is
# .github/actions/battleship-devenv-rust.
#
# - The image's unused toolchains are deleted in the background: the space is
#   free before the build needs it, and nothing waits on it.
# - Nix is installed because devenv is a nix tool, then devenv at exactly
#   2.4.0, the version devenv.yaml requires, from the upstream tag
#   (github:cachix/devenv/v2.4.0), built or fetched through nix.
# - The cargo home and target dir are cached per job (rust-cache). It saves
#   only on main: the repo's 10 GB Actions cache is LRU across all branches.
#
# This action does not enter a shell: every later step runs
# `devenv shell -- <command>`. Nothing sets RUSTFLAGS, so .cargo/config.toml's
# tables stay in force.

name: Hosted devenv + rust cache
description: Free disk, install nix and devenv 2.4.0, restore the cargo cache for one checks job.

inputs:
  job:
    description: The job's name; keys the cargo cache (checks-<job>).
    required: true

runs:
  using: composite
  steps:
    - name: Free disk (background)
      shell: bash
      run: |
        nohup sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
          /opt/hostedtoolcache /usr/share/swift /usr/local/share/powershell \
          /usr/local/share/chromium /usr/local/share/boost /opt/microsoft /opt/google \
          </dev/null >/dev/null 2>&1 &
        df -h / | tail -n 1
    - name: Install nix (devenv needs it)
      uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ github.token }}
        extra_nix_config: |
          accept-flake-config = true
    # The tag's flake builds devenv, or fetches it from devenv.cachix.org,
    # which accept-flake-config trusts.
    - name: Install devenv 2.4.0
      shell: bash
      run: |
        set -euo pipefail
        out="$(nix build --no-link --print-out-paths github:cachix/devenv/v2.4.0#devenv)"
        echo "$out/bin" >> "$GITHUB_PATH"
        echo "devenv: $("$out/bin/devenv" --version) ($out)"
    - name: Cargo cache
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: checks-${{ inputs.job }}
        save-if: ${{ github.ref == 'refs/heads/main' }}
        cache-on-failure: true
